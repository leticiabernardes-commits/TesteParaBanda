<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <coloque o título da página no navegador aqui> -->
    <title>Teste para a Banda</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Overlay para escurecer levemente a imagem de fundo -->
    <div class="overlay"></div>

    <!-- Card central com o formulário -->
    <div class="card">
       
        <!-- Cabeçalho do Card -->
        <div class="card-header">
            <!-- <coloque o emoji/ícone do título aqui> -->
            <span class="icon">🎸</span>
            <!-- <coloque o título do formulário aqui> -->
            <h1>Teste para a Banda</h1>
        </div>

        <form>
            <!-- Campo 1: Nome -->
            <div class="input-group">
                <!-- <coloque o rótulo/texto do campo 1 aqui> -->
                <label for="nome">Seu nome:</label>
                <!-- <coloque o texto de exemplo (placeholder) do campo 1 aqui> -->
                <input type="text" id="nome" placeholder="Ex: João Augusto" required>
            </div>

            <!-- Campo 2: Idade -->
            <div class="input-group">
                <!-- <coloque o rótulo/texto do campo 2 aqui> -->
                <label for="idade">Idade:</label>
                <!-- <coloque o texto de exemplo (placeholder) do campo 2 aqui> -->
                <input type="text" id="idade" placeholder="Ex: 16" required>
            </div>

            <!-- Campo 3: Instrumento -->
            <div class="input-group">
                <!-- <coloque o rótulo/texto do campo 3 aqui> -->
                <label for="instrumento">"Qual instrumento você toca?"</label>
                <!-- <coloque o texto de exemplo (placeholder) do campo 3 aqui> -->
                <input type="text" id="instrumento" placeholder="Ex: Piano , Bateria, Canto" required>
            </div>

            <!-- Botão de Envio -->
            <!-- <coloque o texto do botão de envio aqui> -->
            <button type="submit" class="btn-submit">
                Garantir meu Teste 🎙️
            </button>
        </form>

    </div>

</body>
</html>
